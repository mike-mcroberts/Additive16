name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target Additive16_VST3 --parallel 2
      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter 'Additive 16.vst3' | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle not found' }
          Compress-Archive -Path $plugin.FullName -DestinationPath Additive16-Windows-VST3.zip
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Additive16-Windows-VST3
          path: Additive16-Windows-VST3.zip
